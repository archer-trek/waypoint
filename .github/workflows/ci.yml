name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_COMPILE_SDK_VERSION: "37.0"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  test:
    name: Test and build
    # ubuntu-latest is moving to 26.04 through 2026-11-19.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  native-filter:
    name: Detect native changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.filter.outputs.run_rust }}
      run_android: ${{ steps.filter.outputs.run_android }}
      run_macos: ${{ steps.filter.outputs.run_macos }}
      run_windows: ${{ steps.filter.outputs.run_windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check native path changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set_all() {
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_android=true" >> "$GITHUB_OUTPUT"
            echo "run_macos=true" >> "$GITHUB_OUTPUT"
            echo "run_windows=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            set_all
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              set_all
              exit 0
            fi
            CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          else
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_HEAD_SHA"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              set_all
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          RUN_RUST="false"
          RUN_ANDROID="false"
          RUN_MACOS="false"
          RUN_WINDOWS="false"

          RUST_RE='^(src-tauri/(src/|capabilities/|icons/|Cargo\.toml|Cargo\.lock|build\.rs|tauri\.conf\.json)|\.github/workflows/ci\.yml)'
          SHARED_BUILD_RE='^(scripts/lib/|package\.json|package-lock\.json|\.nvmrc)'
          if printf '%s\n' "$CHANGED" | grep -Eq "$RUST_RE"; then
            RUN_RUST="true"
            RUN_ANDROID="true"
            RUN_MACOS="true"
            RUN_WINDOWS="true"
          else
            if printf '%s\n' "$CHANGED" | grep -Eq "$SHARED_BUILD_RE"; then
              RUN_ANDROID="true"
              RUN_MACOS="true"
              RUN_WINDOWS="true"
            fi
            if printf '%s\n' "$CHANGED" | grep -Eq '^(src-tauri/gen/android/|scripts/build-android-apk\.mjs|Makefile)'; then
              RUN_ANDROID="true"
            fi
            if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/build-macos-dmg\.mjs|\.github/workflows/release\.yml|Makefile)'; then
              RUN_MACOS="true"
            fi
            if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/build-windows-installer\.mjs|\.github/workflows/release\.yml|Makefile)'; then
              RUN_WINDOWS="true"
            fi
          fi

          echo "run_rust=${RUN_RUST}" >> "$GITHUB_OUTPUT"
          echo "run_android=${RUN_ANDROID}" >> "$GITHUB_OUTPUT"
          echo "run_macos=${RUN_MACOS}" >> "$GITHUB_OUTPUT"
          echo "run_windows=${RUN_WINDOWS}" >> "$GITHUB_OUTPUT"

  rust-checks:
    name: Rust checks
    needs: native-filter
    if: needs.native-filter.outputs.run_rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-rust

      - name: Check Rust formatting, clippy, and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  android-build:
    name: Android APK build
    needs: native-filter
    if: needs.native-filter.outputs.run_android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Build Android Release APK (aarch64, unsigned, R8 enabled)
        run: node scripts/build-android-apk.mjs --unsigned --out-dir artifacts/android

      - name: Run Android JVM unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest --no-daemon

      - name: Verify R8-kept bridge classes in Release APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(artifacts/android/*.apk)
          test "${#APKS[@]}" -eq 1
          APK_PATH="${APKS[0]}"
          test -f "$APK_PATH"
          DEX_TMP="$(mktemp -d)"
          trap 'rm -rf "$DEX_TMP"' EXIT
          unzip -qo "$APK_PATH" 'classes*.dex' -d "$DEX_TMP"
          DEX_DUMP_FILE="${DEX_TMP}/dexdump.txt"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/dexdump" "${DEX_TMP}"/classes*.dex > "$DEX_DUMP_FILE"
          for symbol in \
            "Lapp/waypoint/client/MainActivity;" \
            "Lapp/waypoint/client/MainActivity\$WaypointAndroidBridge;" \
            "getMediaCacheDirPath" \
            "openMediaFile" \
            "setSystemAppearance" \
            "setSystemBackEnabled" \
            "Lapp/tauri/opener/OpenerPlugin;" \
            "Lapp/waypoint/client/Rust;"; do
            grep -Fq "$symbol" "$DEX_DUMP_FILE" || {
              echo "Missing R8-kept symbol in DEX: $symbol"
              exit 1
            }
          done

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          # Single-file upload. archive: false keeps the APK itself; the artifact name is the filename.
          path: artifacts/android/*.apk
          archive: false
          retention-days: 14

  macos-build:
    name: macOS DMG build
    needs: native-filter
    if: needs.native-filter.outputs.run_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run Rust clippy and unit tests
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build macOS DMG
        run: node scripts/build-macos-dmg.mjs --out-dir artifacts/macos

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          # Single-file upload. archive: false keeps the DMG itself; the artifact name is the filename.
          path: artifacts/macos/*.dmg
          archive: false
          retention-days: 14

  windows-build:
    name: Windows NSIS build
    needs: native-filter
    if: needs.native-filter.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run Rust clippy and unit tests
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Windows NSIS installer
        run: node scripts/build-windows-installer.mjs --out-dir artifacts/windows

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          # Single-file upload. archive: false keeps the installer itself; the artifact name is the filename.
          path: artifacts/windows/*.exe
          archive: false
          retention-days: 14
