name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS_VERSION: "36.1.0"
  ANDROID_COMPILE_SDK_VERSION: "37.0"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  test:
    name: Test and build
    # ubuntu-latest is moving to 26.04 through 2026-11-19.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Current LTS. Vitest 5 accepts ^22.12, ^24, or >=26.
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  native-filter:
    name: Detect native changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.filter.outputs.run_native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check native path changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "run_native=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          if echo "$CHANGED" | grep -Eq '^(src-tauri/|\.github/workflows/)'; then
            echo "run_native=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_native=false" >> "$GITHUB_OUTPUT"
          fi

  native-checks:
    name: Rust and Android checks
    needs: native-filter
    if: needs.native-filter.outputs.run_native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_COMPILE_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Android Release APK (aarch64, R8 enabled)
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Run Android JVM unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest

      - name: Verify R8-kept bridge classes in Release APK
        run: |
          set -euo pipefail
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          APK_PATH="${APK_DIR}/app-universal-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="${APK_DIR}/app-universal-release-unsigned.apk"
          fi
          test -f "$APK_PATH"
          if [ "${APK_PATH##*-}" != "unsigned.apk" ]; then
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" verify --verbose "$APK_PATH"
          fi
          DEX_TMP="$(mktemp -d)"
          trap 'rm -rf "$DEX_TMP"' EXIT
          unzip -qo "$APK_PATH" 'classes*.dex' -d "$DEX_TMP"
          DEX_DUMP_FILE="${DEX_TMP}/dexdump.txt"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/dexdump" "${DEX_TMP}"/classes*.dex > "$DEX_DUMP_FILE"
          for symbol in \
            "Lapp/waypoint/client/MainActivity;" \
            "Lapp/waypoint/client/MainActivity\$WaypointAndroidBridge;" \
            "getMediaCacheDirPath" \
            "openMediaFile" \
            "setSystemAppearance" \
            "setSystemBackEnabled" \
            "Lapp/tauri/opener/OpenerPlugin;" \
            "Lapp/waypoint/client/Rust;"; do
            grep -Fq "$symbol" "$DEX_DUMP_FILE" || {
              echo "Missing R8-kept symbol in DEX: $symbol"
              exit 1
            }
          done
