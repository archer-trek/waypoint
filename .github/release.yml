changelog:
  exclude:
    labels:
      - release
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feat
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Build & CI
      labels:
        - build
        - ci
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
