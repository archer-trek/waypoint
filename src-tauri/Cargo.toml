[package]
name = "waypoint"
version = "0.1.0"
description = "Waypoint"
authors = ["Waypoint"]
edition = "2021"

[lib]
name = "waypoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[profile.android-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
